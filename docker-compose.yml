# Local infrastructure only. Application services run via `npm run dev`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: newlink
      POSTGRES_PASSWORD: newlink
      POSTGRES_DB: newlink
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U newlink']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: newlink
      MINIO_ROOT_PASSWORD: newlink-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  # Optional local containerized apps (run via `docker compose --profile app up`)
  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '4000:4000'
    environment:
      API_PORT: 4000
      DATA_DRIVER: memory
      DATABASE_URL: postgres://newlink:newlink@postgres:5432/newlink
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      API_BASE_URL: http://api:4000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
