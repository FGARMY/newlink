services:
  postgres:
    image: postgres:17-alpine
    container_name: newlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newlink}
      POSTGRES_DB: ${POSTGRES_DB:-newlink}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-newlink} -d ${POSTGRES_DB:-newlink}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - newlink-network

  redis:
    image: redis:7-alpine
    container_name: newlink-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - newlink-network

  minio:
    image: minio/minio:latest
    container_name: newlink-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-newlink}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-newlink-dev-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    networks:
      - newlink-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: newlink-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATA_DRIVER: ${DATA_DRIVER:-memory}
      DATABASE_URL: postgres://${POSTGRES_USER:-newlink}:${POSTGRES_PASSWORD:-newlink}@postgres:5432/${POSTGRES_DB:-newlink}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://web:3000}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-newlink}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-newlink-dev-secret}
      S3_PUBLIC_BUCKET: newlink-media
      S3_PRIVATE_BUCKET: newlink-kyc
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - newlink-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: newlink-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BASE_URL: ${INTERNAL_API_URL:-http://api:4000/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - newlink-network

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  newlink-network:
    driver: bridge
